services:

  user-db:
    image: postgres:17
    container_name: shopsphere-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere_password
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U shopsphere -d user_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:17
    container_name: shopsphere-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere_password
    ports:
      - "5434:5432"  # Changed external port to 5434 to avoid conflict
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U shopsphere -d product_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:17
    container_name: shopsphere-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere_password
    ports:
      - "5435:5432"
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U shopsphere -d inventory_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:17
    container_name: shopsphere-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere_password
    ports:
      - "5436:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U shopsphere -d order_db" ]
      interval: 10s
      timeout: 5s
      retries: 5



volumes:
  user_db_data:
  product_db_data:
  inventory_db_data:
  order_db_data:
