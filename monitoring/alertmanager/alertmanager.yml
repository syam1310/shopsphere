global:
  resolve_timeout: 5m

route:
  receiver: shopsphere-ops
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: shopsphere-ops
    slack_configs:
      - api_url_file: /run/secrets/alertmanager_slack_webhook
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }} — {{ .Annotations.description }}{{ "\\n" }}{{ end }}'
