global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/shopsphere-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: shopsphere-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api-gateway:8080]
  - job_name: shopsphere-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - user-service:8081
          - product-service:8082
          - inventory-service:8083
          - order-service:8084
          - cart-service:8085
          - payment-service:8086
          - notification-service:8087

  - job_name: shopsphere-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api-gateway:8080/actuator/health
          - http://user-service:8081/actuator/health
          - http://product-service:8082/actuator/health
          - http://inventory-service:8083/actuator/health
          - http://order-service:8084/actuator/health
          - http://cart-service:8085/actuator/health
          - http://payment-service:8086/actuator/health
          - http://notification-service:8087/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
