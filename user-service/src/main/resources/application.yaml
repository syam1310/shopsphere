server:
  port: 8081

spring:
  application:
    name: user-service



  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: shopsphere
    password: shopsphere_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

google:
  client-id: ${GOOGLE_CLIENT_ID:}

app:
  admin-setup-code: ${ADMIN_SETUP_CODE:}
  refresh-token:
    expiration: 2592000000

logging:
  level:
    com.shopsphere.userservice: INFO
