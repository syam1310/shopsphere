server:
  port: 8086

spring:
  application:
    name: payment-service

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5438/payment_db}
    username: ${PAYMENT_DB_USERNAME:shopsphere}
    password: ${PAYMENT_DB_PASSWORD:shopsphere_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

internal-service:
  secret: ${INTERNAL_SERVICE_SECRET}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
