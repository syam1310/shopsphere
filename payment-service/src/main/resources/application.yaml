server:
  port: 8086

spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5438/payment_db}
    username: ${PAYMENT_DB_USERNAME:shopsphere}
    password: ${PAYMENT_DB_PASSWORD:shopsphere_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
