server:
  port: 8084

spring:
  application:
    name: order-service

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  datasource:
    url: jdbc:postgresql://localhost:5436/order_db
    username: shopsphere
    password: shopsphere_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET}

product-service:
  base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

inventory-service:
  base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
  internal-secret: ${INTERNAL_SERVICE_SECRET}

cart-service:
  base-url: ${CART_SERVICE_URL:http://localhost:8085}

payment-service:
  base-url: ${PAYMENT_SERVICE_URL:http://localhost:8086}
  internal-secret: ${INTERNAL_SERVICE_SECRET}

user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8081}

notification-service:
  base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
  internal-secret: ${INTERNAL_SERVICE_SECRET}
