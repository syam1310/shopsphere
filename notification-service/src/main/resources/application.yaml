spring:
  application:
    name: notification-service
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5439/notification_db}
    username: ${DB_USERNAME:shopsphere}
    password: ${DB_PASSWORD:shopsphere_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8087

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  mail:
    from: ${MAIL_FROM:}
  internal-service-secret: ${INTERNAL_SERVICE_SECRET:}
