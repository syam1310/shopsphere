server:
  port: 8083

spring:
  application:
    name: inventory-service

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  datasource:
    url: jdbc:postgresql://localhost:5435/inventory_db
    username: shopsphere
    password: shopsphere_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG
    com.shopsphere.inventory_service.security: DEBUG

jwt:
  secret: ${JWT_SECRET}

internal-service:
  secret: ${INTERNAL_SERVICE_SECRET}


management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
